<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>/* Main Banner */
    #main_banner {
      padding:0 24px;
    }
    #main_banner .inner_banner { /* main banner / 가운데 정렬 */
      width:100%; height:600px;
      border-radius: 20px;
      overflow:hidden;
      /* background:url('../images/main_banner.png') center/cover; */
    
      display:flex;
      align-items:center;
    
      position:relative;
    }
    .slideImg_wrap { /* slide Img div */
      width:100%; height:100%;
      position:absolute;
      top:0; left:0;
      z-index:-1;
      display:flex;
      justify-content: flex-start;
      /* transition:.5s; */
    }
    .slideImg_wrap img { /* slide Img */
      width:100%;
      height:100%;
      object-fit: cover;
      /* + */
      position:absolute;
      top:0; left:0;
      opacity: 0;
      visibility: hidden;
      transition:.5s;
    } 
    .slideImg_wrap img.show { /* slide Img */
      opacity:1;
      visibility:visible;
    } 
    
    
    #main_banner .inner_banner > article { /* 1200  */
      width:1200px;
      padding:0 5px;
      margin:auto;
      position:relative;
      /* position:absolute; */
    }
    .slideTxt_wrap {
      position: relative;
      top:30px;
    }
    .slideTxt_wrap > article { 
      position: absolute;
      top:0; left:0;
      opacity: 0;
      visibility: hidden;
      transition:.5s;
    }
    .slideTxt_wrap article.show {
      opacity: 1;
      visibility:visible;
    }
    
    
    
    #main_banner .inner_banner .slideTxt_wrap > article > p,
    #main_banner .inner_banner .slideTxt_wrap > article.show > p {
      font-size:18px;
      line-height:1.2;
      color:#1A3341;
    }
    #main_banner .inner_banner .slideTxt_wrap > article > h1,
    #main_banner .inner_banner .slideTxt_wrap > article.show > h1 {
      font-size:20px;
      font-weight: 900;
    }
      /*
    #main_banner .inner_banner > article > p {
      font-size:18px;
      line-height:1.2;
      color:#1A3341;
    }
    #main_banner .inner_banner > article > h1 {
      font-size:64px;
      font-weight: 900;
    }
      */
    #main_banner .indicator { /*indicator*/
      display:flex;
      align-items:center;
      gap:18px;
      margin-top:350px;
    }
    #main_banner .indicator button { 
      width:42px;
      height:42px;
      border-radius:8px;
      background-color: transparent;
      border:solid 1px #111;
    
      display:flex;
      justify-content: center;
      align-items:center;
    }
    #main_banner .indicator button img {
      width:24px;
      height:24px;
    }
    #main_banner .indicator p {
      font-size:20px;
      font-weight:500;
      letter-spacing:2px;
    }
    #main_banner .indicator span:not(.indicator_now) {
      color:#767676;
    }
  </style>
</head>
<body>

  <!-- Main Banner -->
  <section id="main_banner">
    <div class="inner_banner">
      <!-- slide -->
      <div class="slideImg_wrap">
        <img src="images/main_banner1.png" alt="slide" title="slide">
        <img src="images/main_banner2.png" alt="slide" title="slide">
        <img src="images/main_banner3.png" alt="slide" title="slide">
      </div>
      <article>
        <article class="slideTxt_wrap">
          <!--slide txt-->
          <article>
            <p>집에서도 관리가 쉽고, 매일 편안하게 입을 수 있는</p>
            <h1>
              SOFT PANTS <br>
              COLLECTION
            </h1>
          </article>
          <article>
            <p>깔끔하고 가벼운 워싱 데님과 유행에 따라가지 않는 루즈핏의 조화</p>
            <h1>
              Washed PANTS <br>
              Loose Fit
            </h1>
          </article>
          <article>
            <p>2025 청청패션을 담다. 세부적인 디테일이 담겨진 데님 세트</p>
            <h1>
              Double Denim <br>
              2025 Series
            </h1>
          </article>
        </article>
        <div class="indicator">
          <button class="slide_prevbtn"><img src="images/icon_prevBtn(slim).png" alt="Indicator_prev"></button>
          <p> <span class="indicator_now">1</span> <span>/ 3</span> </p>
          <button class="slide_nextbtn"><img src="images/icon_nextBtn(slim).png" alt="Indicator_prev"></button>
        </div>
      </article>
    </div>
  </section>
  


  <script>
    let slides = document.querySelectorAll(".slideImg_wrap img");
    let index = 0;
    const intervalTime = 3000;/*3초 >3<*/
    let slideInterval; //setInterval 담아주세용

    // console.log(slides);
    // setInterval(function(){
    //   slides.forEach((slide, i) => {
    //     slide.classList.toggle("show", i === index);
    //   });
    // }, 3000);

    function showSlide(index){
      slides.forEach((slide, i) => {
        slide.classList.toggle("show", i === index);
      });
    }

    function nextSlide() {
        index = (index + 1) % slides.length; //1%3=1, 2%3=2, 3%3=0

        showSlide(index);
      }

      // 자동 슬라이딩(무한반복), 얜 그냥 시작 함수 -> nextSlide() 전달
      function startSlideShow() {
        slideInterval = setInterval(nextSlide, intervalTime); // nextSlide함수를 3초동안 무한반복
      }

      // 얜 멈춤 함수
      function stopSlideShow() {
        clearInterval(slideInterval);
      }


      //초기 설정
      showSlide(index); // 1. 초기값 0번 보냄
      startSlideShow(); // 3. (1)번의 코드가 다 읽히면 실행
    

    // function nextSlide(){
    //   // index = index < slides.length-1 ? index++ : 0; //얘 안돼., 그냥 얜 틀렸나봐
          // index < slides.length-1 ? ++index : 0;  -> index++하면 증가되지 않은 값이 들어감 그래서 ++index
    //   index = (index + 1) % slides.length;
    //   setInterval(showSlide(index), 3000);
    // }

    // showSlide(index);
    // nextSlide();
  </script>
</body>
</html>
